<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta id="theme-color" name="theme-color" content="#0f1514" />
    <meta name="description" content="Ben Shortcut：个人小工具入口。" />
    <title>Ben Shortcut</title>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("add") === "1") {
          window.location.replace(`./pulse-rc-tracker/${window.location.search}`);
        }
      })();

      (() => {
        try {
          const savedTheme = localStorage.getItem("ben-shortcut-theme");
          document.documentElement.dataset.theme = savedTheme || "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="icon" href="./app-icon.svg" />
    <link rel="apple-touch-icon" href="./app-icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=hub-v2" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="kicker">Ben Shortcut</p>
          <h1>小工具入口</h1>
          <p class="intro">RC、Prop Firm、Options Trainer 都放在这里；以后新的小项目也继续往这里收。</p>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="当前为黑夜模式，点击切换到白天模式">
          <span class="theme-icon" aria-hidden="true">
            <svg class="sun-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="M4.93 4.93l1.41 1.41" />
              <path d="M17.66 17.66l1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="M4.93 19.07l1.41-1.41" />
              <path d="M17.66 6.34l1.41-1.41" />
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24">
              <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7.8 7.8 0 1 0 10.5 10.5Z" />
            </svg>
          </span>
          <span id="theme-toggle-label">黑夜</span>
        </button>
      </header>

      <section class="project-grid" aria-label="项目列表">
        <a class="project-card pulse" href="./pulse-rc-tracker/">
          <span class="project-type">Card Rewards</span>
          <h2>Pulse RC Tracker</h2>
          <p>汇丰 Pulse 返现、迎新、餐饮和消费进度。</p>
          <strong>Open</strong>
        </a>
        <a class="project-card prop" href="./prop-firm/">
          <span class="project-type">Ledger</span>
          <h2>Prop Firm</h2>
          <p>买号成本、出金记录和 USD 总盈亏。</p>
          <strong>Open</strong>
        </a>
        <a class="project-card options" href="./options-strategy-trainer/">
          <span class="project-type">Learning</span>
          <h2>Options Strategy Trainer</h2>
          <p>从 Market Cycle 和 Objective 选择期权策略。</p>
          <strong>Open</strong>
        </a>
      </section>

      <footer>Ben Shortcut / local-first tools</footer>
    </main>

    <script>
      const root = document.documentElement;
      const themeColor = document.getElementById("theme-color");
      const toggle = document.getElementById("theme-toggle");
      const toggleLabel = document.getElementById("theme-toggle-label");

      function applyTheme(theme) {
        root.dataset.theme = theme;
        themeColor.setAttribute("content", theme === "light" ? "#f5f7f5" : "#0f1514");
        toggleLabel.textContent = theme === "light" ? "白天" : "黑夜";
        toggle.setAttribute(
          "aria-label",
          theme === "light" ? "当前为白天模式，点击切换到黑夜模式" : "当前为黑夜模式，点击切换到白天模式",
        );
      }

      applyTheme(root.dataset.theme || "dark");

      toggle.addEventListener("click", () => {
        const nextTheme = root.dataset.theme === "light" ? "dark" : "light";
        try {
          localStorage.setItem("ben-shortcut-theme", nextTheme);
        } catch {
          undefined;
        }
        applyTheme(nextTheme);
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((registration) => registration.update())
            .catch(() => undefined);
        });
      }
    </script>
  </body>
</html>
